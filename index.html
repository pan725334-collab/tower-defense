<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Легенда Обороны</title>
<!-- VK Bridge (официальная библиотека) -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#05050f; font-family:'Segoe UI',Tahoma,sans-serif; touch-action: manipulation; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
#game-container { position:absolute; top:50%; left:50%; width:960px; height:600px; transform-origin: center center; transform: translate(-50%, -50%) scale(1); overflow:hidden; box-shadow:0 0 40px rgba(0,150,255,0.25); background:#0d0d2b; }
#gameCanvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; background:#0d0d2b; cursor:crosshair; touch-action: none; }
#ui-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.screen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(5,5,20,0.95); pointer-events:auto; color:#e0e0ff; z-index:10; overflow-y:auto; padding:20px; -webkit-overflow-scrolling: touch; }
#screen-shop, #screen-difficulty, #screen-campaign { justify-content:flex-start; padding-top:24px; padding-bottom:24px; }
.screen.hidden { display:none; }
.screen h1 { font-size:2.5rem; margin-bottom:1rem; background:linear-gradient(135deg,#00c6ff,#0072ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.screen h2 { font-size:1.8rem; margin-bottom:1.2rem; color:#aaccff; }
.screen p { font-size:1rem; color:#8899bb; margin-bottom:2rem; }
.menu-btn { display:block; width:280px; padding:14px 20px; margin:8px 0; border:1px solid rgba(0,200,255,0.3); border-radius:12px; background:rgba(0,50,100,0.6); color:#cceeff; font-size:1.1rem; cursor:pointer; transition:all 0.2s ease; text-align:center; letter-spacing:0.5px; font-family:inherit; }
.menu-btn:hover { background:rgba(0,100,200,0.7); border-color:#00c6ff; box-shadow:0 0 20px rgba(0,150,255,0.4); transform:scale(1.03); }
.menu-btn:active { transform:scale(0.98); }
.menu-btn.primary { background:linear-gradient(135deg,#0055aa,#0088dd); border-color:#00aaff; color:#fff; font-weight:600; }
.menu-btn.shop { background:linear-gradient(135deg,#a06a00,#d09000); border-color:#ffcc44; color:#fff; font-weight:600; }
.menu-btn.shop:hover { background:linear-gradient(135deg,#c08000,#f0b000); box-shadow:0 0 20px rgba(255,200,60,0.5); }
.menu-btn.danger { background:linear-gradient(135deg,#8a1a1a,#c02020); border-color:#ff5555; color:#fff; font-weight:600; }
.menu-btn.danger:hover { background:linear-gradient(135deg,#a02020,#dd2828); box-shadow:0 0 20px rgba(255,80,80,0.5); }
.missions-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; width:100%; max-width:860px; margin:1rem 0 1.5rem; }
.mission-card { position:relative; padding:10px 6px; border-radius:12px; border:2px solid rgba(0,150,255,0.35); background:linear-gradient(160deg, rgba(0,60,120,0.85), rgba(0,20,50,0.9)); cursor:pointer; transition:all 0.2s ease; text-align:center; color:#cceeff; }
.mission-card:hover { transform:translateY(-3px) scale(1.02); border-color:#00c6ff; box-shadow:0 6px 24px rgba(0,180,255,0.35); }
.mission-card.locked { opacity:0.45; cursor:not-allowed; background:linear-gradient(160deg, rgba(30,30,50,0.85), rgba(15,15,30,0.9)); border-color:rgba(100,100,150,0.35); }
.mission-card.locked:hover { transform:none; box-shadow:none; border-color:rgba(100,100,150,0.35); }
.mission-card.completed { border-color:#00ffaa; box-shadow:0 0 20px rgba(0,255,170,0.25); }
.mission-card.boss { background:linear-gradient(160deg, rgba(120,20,20,0.9), rgba(50,0,0,0.95)); border-color:rgba(255,80,80,0.6); }
.mission-card.boss:hover { border-color:#ff4444; box-shadow:0 6px 24px rgba(255,80,80,0.45); }
.mission-card.boss.completed { border-color:#ffaa00; box-shadow:0 0 24px rgba(255,170,0,0.4); }
.mission-num { font-size:1.2rem; font-weight:800; color:#66ddff; margin-bottom:2px; letter-spacing:1px; }
.mission-card.completed .mission-num { color:#00ffaa; }
.mission-card.locked .mission-num { color:#666; }
.mission-card.boss .mission-num { color:#ff6666; }
.mission-card.boss.completed .mission-num { color:#ffcc44; }
.mission-name { font-size:0.68rem; color:#aabbdd; margin-bottom:3px; font-weight:600; text-transform:uppercase; letter-spacing:0.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mission-info { font-size:0.6rem; color:#7a8baa; line-height:1.3; }
.mission-card.boss .mission-info { color:#ffbbbb; font-weight:700; }
.mission-stars { font-size:0.75rem; color:#ffcc44; font-weight:700; margin-top:4px; letter-spacing:0.3px; }
.mission-stars .empty { color:rgba(100,100,140,0.5); }
.mission-status { position:absolute; top:4px; right:6px; font-size:0.85rem; }
.mission-card.completed .mission-status::after { content:'✔'; color:#00ffaa; }
.mission-card.locked .mission-status::after { content:'🔒'; }
.mission-card.boss .mission-status::before { content:'💀'; position:absolute; top:4px; left:6px; font-size:0.8rem; }
.mission-card.boss.completed .mission-status::before { content:'👑'; }

#shop-resources { color:#ffcc44; font-size:1.2rem; font-weight:700; }
.shop-tabs { display:flex; gap:8px; width:100%; max-width:820px; margin:0.6rem 0 0.8rem; flex-wrap:wrap; justify-content:center; }
.shop-tab { padding:10px 18px; border-radius:10px; border:2px solid rgba(0,150,255,0.35); background:rgba(0,40,80,0.7); color:#aaddff; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.15s; font-family:inherit; }
.shop-tab:hover { background:rgba(0,80,140,0.8); border-color:#00c6ff; }
.shop-tab.active { background:linear-gradient(135deg, #0088dd, #00aaff); border-color:#00ddff; color:#fff; box-shadow:0 0 15px rgba(0,200,255,0.5); }
.shop-tab:active { transform:scale(0.97); }
.shop-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; width:100%; max-width:820px; margin:0.4rem 0 1.5rem; }
.shop-item { padding:14px 16px; border-radius:14px; border:2px solid rgba(0,150,255,0.35); background:linear-gradient(160deg, rgba(0,60,120,0.85), rgba(0,20,50,0.9)); text-align:left; color:#cceeff; cursor:pointer; transition:all 0.2s ease; user-select:none; }
.shop-item:hover:not(.maxed):not(.cant-afford) { border-color:#00c6ff; box-shadow:0 4px 20px rgba(0,180,255,0.4); transform:translateY(-2px); }
.shop-item:active:not(.maxed):not(.cant-afford) { transform:translateY(0) scale(0.98); }
.shop-item.maxed { opacity:0.9; cursor:default; border-color:#00ffaa; background:linear-gradient(160deg, rgba(0,80,60,0.85), rgba(0,30,20,0.9)); }
.shop-item.cant-afford { cursor:not-allowed; border-color:rgba(255,80,80,0.5); opacity:0.8; }
.shop-item.cant-afford:hover { transform:none; }
.shop-item.shake { animation: shake 0.35s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.shop-icon { font-size:1.4rem; margin-bottom:4px; display:inline-block; }
.shop-name { font-weight:700; font-size:1rem; color:#aaddff; margin-bottom:4px; }
.shop-item.maxed .shop-name { color:#aaffcc; }
.shop-desc { font-size:0.8rem; color:#8899bb; margin-bottom:8px; line-height:1.35; }
.shop-level { font-size:0.8rem; color:#fff; margin-bottom:6px; }
.shop-level .dots { display:inline-block; color:#00ffaa; letter-spacing:2px; margin-left:4px; }
.shop-level .dots .empty { color:rgba(100,100,150,0.4); }
.shop-cost { font-size:0.95rem; font-weight:700; color:#ffcc44; display:flex; align-items:center; gap:4px; }
.shop-cost.cant { color:#ff6666; }
.shop-cost .label { font-size:0.75rem; color:#8899bb; font-weight:400; }
.shop-maxed { font-size:0.95rem; font-weight:700; color:#00ffaa; }
.shop-empty { text-align:center; color:#556688; font-size:1rem; padding:2rem 0; width:100%; grid-column: 1 / -1; }

.difficulty-list { display:flex; flex-direction:column; gap:14px; width:100%; max-width:560px; margin:1rem 0 1.5rem; }
.difficulty-btn { display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:14px; border:2px solid rgba(0,150,255,0.35); background:linear-gradient(160deg, rgba(0,60,120,0.85), rgba(0,20,50,0.9)); color:#cceeff; cursor:pointer; transition:all 0.15s; font-family:inherit; text-align:left; }
.difficulty-btn.easy:hover:not(.locked) { border-color:#00ff88; box-shadow:0 0 22px rgba(0,255,120,0.45); transform:translateY(-2px); }
.difficulty-btn.medium:hover:not(.locked) { border-color:#ffcc44; box-shadow:0 0 22px rgba(255,200,60,0.45); transform:translateY(-2px); }
.difficulty-btn.hard:hover:not(.locked) { border-color:#ff4444; box-shadow:0 0 22px rgba(255,80,80,0.45); transform:translateY(-2px); }
.difficulty-btn.locked { opacity:0.5; cursor:not-allowed; }
.difficulty-btn.locked:hover { transform:none; }
.diff-icon { font-size:2.2rem; line-height:1; }
.diff-info { flex:1; min-width:0; }
.diff-name { font-size:1.15rem; font-weight:700; color:#fff; margin-bottom:4px; }
.diff-desc { font-size:0.8rem; color:#8899bb; line-height:1.35; }
.diff-stars { font-size:1.5rem; letter-spacing:3px; flex-shrink:0; }
.diff-stars .filled { color:#ffcc44; }
.diff-stars .empty { color:rgba(100,100,140,0.4); }
.diff-lock { font-size:0.75rem; color:#ff8888; margin-top:4px; }

#battle-ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none; z-index:5; }
#battle-ui.active { display:block; }
.battle-top-bar { position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:rgba(0,10,30,0.85); border-radius:12px; border:1px solid rgba(0,150,255,0.25); pointer-events:auto; flex-wrap:wrap; gap:8px; backdrop-filter:blur(6px); }
.battle-stat { color:#aaddff; font-size:0.95rem; }
.battle-stat span { color:#fff; font-weight:700; }
.battle-controls { display:flex; gap:8px; margin-left:auto; }
.battle-ctrl-btn { padding:6px 14px; border-radius:8px; border:1px solid rgba(0,200,255,0.4); background:rgba(0,50,100,0.7); color:#cceeff; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.15s; font-family:inherit; min-width:64px; }
.battle-ctrl-btn:hover:not(:disabled) { background:rgba(0,100,200,0.8); border-color:#00c6ff; }
.battle-ctrl-btn:active:not(:disabled) { transform:scale(0.96); }
.battle-ctrl-btn:disabled { opacity:0.45; cursor:not-allowed; }
.battle-ctrl-btn.active { background:rgba(0,200,100,0.55); border-color:#00ffaa; color:#fff; box-shadow:0 0 12px rgba(0,255,170,0.4); }
.battle-ctrl-btn.danger { border-color:rgba(255,80,80,0.5); }
.battle-ctrl-btn.danger:hover { background:rgba(180,40,40,0.7); border-color:#ff6666; }
.battle-ctrl-btn.armed { background:rgba(200,120,0,0.7); border-color:#ffaa00; color:#fff; animation:pulse 0.7s infinite alternate; }
@keyframes pulse { from { box-shadow:0 0 6px rgba(255,170,0,0.4); } to { box-shadow:0 0 18px rgba(255,170,0,0.9); } }
.battle-ctrl-btn.start-btn { background:rgba(0,140,70,0.75); border-color:#00ff88; color:#eafff2; min-width:110px; }
.battle-ctrl-btn.start-btn.ready { animation:pulse-green 0.9s infinite alternate; background:linear-gradient(135deg, #008a44, #00c568); color:#fff; }
.battle-ctrl-btn.start-btn:hover:not(:disabled) { background:linear-gradient(135deg, #00a854, #00e87a); border-color:#7dffb8; }
@keyframes pulse-green { from { box-shadow:0 0 6px rgba(0,255,120,0.4); } to { box-shadow:0 0 22px rgba(0,255,120,0.95); } }
.battle-ctrl-btn.pause-btn { background:rgba(120,90,0,0.7); border-color:#ffcc44; color:#fff5cc; min-width:64px; }
.battle-ctrl-btn.pause-btn:hover:not(:disabled) { background:rgba(180,140,0,0.85); border-color:#ffdd66; }

.tower-selector { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:8px 12px; background:rgba(0,10,30,0.92); border-radius:14px; border:1px solid rgba(0,150,255,0.3); pointer-events:auto; backdrop-filter:blur(6px); flex-wrap:wrap; max-width:95%; justify-content:center; }
.tower-option { width:58px; height:58px; border-radius:10px; border:2px solid rgba(0,150,255,0.3); background:rgba(0,40,80,0.7); display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; transition:all 0.15s; color:#aaddff; font-size:1.3rem; line-height:1; }
.tower-option:hover { transform:translateY(-2px); border-color:#00c6ff; }
.tower-option.selected { border-color:#00ffaa; box-shadow:0 0 16px rgba(0,255,170,0.5); background:rgba(0,80,60,0.7); }
.tower-option .cost { font-size:0.65rem; color:#ffcc44; margin-top:3px; font-weight:700; }

#ability-bar { position:absolute; top:78px; left:12px; display:none; flex-direction:column; gap:6px; background:rgba(0,10,30,0.92); border:1px solid rgba(255,180,80,0.35); border-radius:12px; padding:8px; pointer-events:auto; z-index:6; backdrop-filter:blur(6px); max-height:400px; overflow-y:auto; }
#ability-bar.active { display:flex; }
.ability-btn { position:relative; width:56px; height:56px; border-radius:10px; border:2px solid rgba(255,180,80,0.5); background:rgba(80,40,0,0.75); color:#ffe0aa; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; transition:all 0.15s; font-size:1.5rem; line-height:1; overflow:hidden; }
.ability-btn:hover:not(.on-cooldown) { transform:scale(1.05); border-color:#ffcc44; box-shadow:0 0 15px rgba(255,200,60,0.5); }
.ability-btn.active { border-color:#ffaa00; background:rgba(180,90,0,0.85); box-shadow:0 0 16px rgba(255,170,0,0.7); }
.ability-btn.on-cooldown { cursor:not-allowed; opacity:0.75; }
.ability-btn .cd-overlay { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,0.72); pointer-events:none; transition:height 0.08s linear; display:flex; align-items:flex-start; justify-content:center; padding-top:4px; font-size:0.75rem; font-weight:800; color:#fff; text-shadow:0 0 4px #000, 0 0 8px #000; }
.ability-btn .ab-label { font-size:0.6rem; color:#ffddaa; margin-top:2px; font-weight:600; }

#tower-target-panel { position:absolute; right:12px; bottom:88px; background:rgba(0,10,30,0.95); border:2px solid rgba(0,200,255,0.5); border-radius:12px; padding:10px; display:none; flex-direction:column; gap:5px; pointer-events:auto; z-index:7; min-width:158px; box-shadow:0 0 22px rgba(0,150,255,0.4); backdrop-filter:blur(6px); }
#tower-target-panel.active { display:flex; }
.ttp-title { font-size:0.8rem; color:#aaddff; font-weight:700; margin-bottom:2px; text-align:center; letter-spacing:0.4px; padding-bottom:4px; border-bottom:1px solid rgba(0,200,255,0.2); }
.ttp-btn { padding:8px 12px; border-radius:8px; border:1px solid rgba(0,200,255,0.35); background:rgba(0,50,100,0.7); color:#cceeff; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; text-align:left; transition:all 0.15s; display:flex; align-items:center; gap:6px; }
.ttp-btn:hover { background:rgba(0,100,200,0.8); border-color:#00c6ff; }
.ttp-btn:active { transform:scale(0.97); }
.ttp-btn.active { background:linear-gradient(135deg,#0088dd,#00aaff); color:#fff; border-color:#00ddff; box-shadow:0 0 12px rgba(0,200,255,0.5); }
.ttp-btn.active::after { content:' ✔'; margin-left:auto; }
.ttp-close { margin-top:4px; background:rgba(120,30,30,0.6); border-color:rgba(255,80,80,0.5); color:#ffcccc; text-align:center; justify-content:center; }
.ttp-close:hover { background:rgba(180,40,40,0.8); border-color:#ff6666; }

#pause-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(2,5,20,0.82); backdrop-filter:blur(6px); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:20; pointer-events:auto; animation:fadeIn 0.2s ease; }
#pause-overlay.active { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.pause-title { font-size:3rem; font-weight:800; letter-spacing:4px; background:linear-gradient(135deg,#66ddff,#0088ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:0.4rem; text-shadow:0 0 30px rgba(0,180,255,0.3); }
.pause-sub { font-size:1rem; color:#8899bb; margin-bottom:2rem; letter-spacing:0.4px; }

#btn-cancel-aim { position:absolute; top:78px; left:50%; transform: translateX(-50%); padding: 10px 22px; background: linear-gradient(135deg, #a02020, #cc2828); color: #fff; border: 2px solid #ff6666; border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; z-index: 8; display: none; pointer-events: auto; box-shadow: 0 0 22px rgba(255, 80, 80, 0.55); letter-spacing: 0.4px; }
#btn-cancel-aim.active { display: block; animation: pulse-red 0.9s infinite alternate; }
#btn-cancel-aim:active { transform: translateX(-50%) scale(0.96); }
@keyframes pulse-red { from { box-shadow: 0 0 12px rgba(255, 80, 80, 0.5); } to { box-shadow: 0 0 26px rgba(255, 80, 80, 0.95); } }

body.touch .tower-option { width:66px; height:66px; font-size:1.5rem; }
body.touch .tower-option .cost { font-size:0.75rem; }
body.touch .ability-btn { width:64px; height:64px; font-size:1.7rem; }
body.touch .ability-btn .ab-label { font-size:0.7rem; }
body.touch .battle-ctrl-btn { padding: 8px 16px; min-width:70px; font-size:0.95rem; }
body.touch .battle-ctrl-btn.start-btn { min-width:120px; }
body.touch .ttp-btn { padding: 10px 14px; font-size: 0.9rem; }
body.touch #tower-target-panel { min-width: 180px; padding: 12px; gap: 7px; }
body.touch .menu-btn { padding: 16px 22px; font-size: 1.15rem; }

#screen-result .result-stats { margin:1.5rem 0; text-align:center; }
#screen-result .result-stats div { font-size:1.1rem; margin:8px 0; color:#aabbdd; }
#screen-result .result-stats span { color:#fff; font-weight:700; }
#screen-result .result-stats .reward-line { color:#ffcc44; font-size:1.2rem; font-weight:700; margin-top:12px; }
.result-stars { font-size:3rem; letter-spacing:12px; margin:0.8rem 0 0.4rem; text-align:center; }
.result-stars .filled { color:#ffcc44; text-shadow:0 0 20px rgba(255,200,60,0.7); }
.result-stars .empty { color:rgba(100,100,140,0.4); }
.result-diff-label { font-size:0.85rem; color:#8899bb; text-transform:uppercase; letter-spacing:2px; margin-top:6px; }
.result-diff-label.boss { color:#ff6666; font-weight:700; }
#err { position:fixed; top:0; left:0; right:0; background:#8a0000; color:#fff; padding:8px 12px; font-family:monospace; font-size:0.8rem; z-index:9999; display:none; max-height:40vh; overflow:auto; }
#err.visible { display:block; }

@media (max-height: 500px) {
    .battle-top-bar { padding: 6px 10px; gap: 6px; }
    .battle-stat { font-size: 0.8rem; }
    .tower-selector { padding: 6px 10px; gap: 6px; bottom: 6px; }
    .tower-option { width: 52px; height: 52px; font-size: 1.1rem; }
    .ability-btn { width: 48px; height: 48px; font-size: 1.2rem; }
    #ability-bar { top: 66px; padding: 6px; }
    .pause-title { font-size: 2rem; }
}
</style>
</head>
<body>
<div id="err"></div>
<div id="game-container">
    <canvas id="gameCanvas" width="960" height="600"></canvas>
    <div id="ui-overlay">
        <div id="tower-target-panel">
            <div class="ttp-title" data-i18n="ttp_title">🎯 Режим прицела</div>
            <button class="ttp-btn" type="button" data-mode="nearest"><span>🔵</span> <span data-i18n="ttp_nearest">Ближний</span></button>
            <button class="ttp-btn" type="button" data-mode="farthest"><span>🟣</span> <span data-i18n="ttp_farthest">Дальний</span></button>
            <button class="ttp-btn" type="button" data-mode="strongest"><span>🔴</span> <span data-i18n="ttp_strongest">Сильнейший</span></button>
            <button class="ttp-btn" type="button" data-mode="weakest"><span>🟢</span> <span data-i18n="ttp_weakest">Слабейший</span></button>
            <button class="ttp-btn ttp-close" type="button" data-ttp-close data-i18n="ttp_close">✖ Закрыть</button>
        </div>

        <button id="btn-cancel-aim" type="button" data-i18n="cancel_aim">✖ Отмена наведения</button>

        <div id="pause-overlay">

function updateGameScale() {
    const container = document.getElementById('game-container');
    if (!container) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const s = Math.min(vw / LOGICAL_W, vh / LOGICAL_H);
    container.style.transform = `translate(-50%, -50%) scale(${s})`;
}
updateGameScale();
window.addEventListener('resize', updateGameScale);
window.addEventListener('orientationchange', () => {
    updateGameScale();
    setTimeout(updateGameScale, 100);
    setTimeout(updateGameScale, 400);
});

let currentLang = 'ru';

function t(key, ...args) {
    const dict = I18N[currentLang] || I18N.ru;
    let str = dict[key] || I18N.ru[key] || key;
    if (args.length) {
        str = str.replace(/\{(\d+)\}/g, (_, i) => args[i] ?? '');
    }
    return str;
}

function L(obj, field) {
    if (!obj) return '';
    if (currentLang === 'en' && obj[field + 'En'] != null) return obj[field + 'En'];
    return obj[field] ?? '';
}

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerHTML = t(key);
    });
    document.documentElement.lang = currentLang;
}

   ========================================================= */
const SafeStorage = {
    get(k, d=null){ try{ const v=window.localStorage.getItem(k); return v===null?d:v; } catch(e){ return d; } },
    set(k, v){ try{ window.localStorage.setItem(k, String(v)); return true; } catch(e){ return false; } },
    getJSON(k, d=null){ const r=this.get(k,null); if(r===null) return d; try{ return JSON.parse(r); }catch(e){ return d; } },
    setJSON(k, v){ try{ return this.set(k, JSON.stringify(v)); } catch(e){ return false; } }
};

/* VK Bridge wrapper — безопасные вызовы */
const VK = {
    available: typeof vkBridge !== 'undefined',
    userId: null,
    launchParams: {},
    isMobile: false,

    async init() {
        if (!this.available) return false;
        try {
            await vkBridge.send('VKWebAppInit');
            return true;
        } catch(e) {
            console.warn('[VK] init failed:', e);
            return false;
        }
    },

    /* Параметры запуска VK (vk_user_id, vk_language, vk_platform и т.д.) */
    parseLaunchParams() {
        const qs = new URLSearchParams(location.search);
        const params = {};
        qs.forEach((value, key) => { params[key] = value; });
        this.launchParams = params;
        this.isMobile = params.vk_platform === 'mobile_iphone' ||
                        params.vk_platform === 'mobile_android' ||
                        params.vk_platform === 'mobile_ipad' ||
                        params.vk_platform === 'mobile_web';
        if (params.vk_user_id) this.userId = parseInt(params.vk_user_id, 10) || null;
    },

    getLanguage() {
        const l = this.launchParams.vk_language;
        if (l && I18N[l]) return l;
        return null;
    },

    /* Получить данные пользователя (для аватарки/имени, если нужно) */
    async getUserInfo() {
        if (!this.available) return null;
        try {
            const info = await vkBridge.send('VKWebAppGetUserInfo');
            this.userId = info.id;
            return info;
        } catch(e) {
            return null;
        }
    },

    /* Облачное хранилище */
    async storageGet(key) {
        if (!this.available) return null;
        try {
            const res = await vkBridge.send('VKWebAppStorageGet', { keys: [key] });
            if (res && res.keys && res.keys[0] && res.keys[0].value) {
                return res.keys[0].value;
            }
        } catch(e) {}
        return null;
    },

    async storageSet(key, value) {
        if (!this.available) return false;
        try {
            await vkBridge.send('VKWebAppStorageSet', { key: key, value: String(value) });
            return true;
        } catch(e) {
            return false;
        }
    },

    /* Реклама с вознаграждением */
    async showRewardedAd() {
        if (!this.available) throw new Error('VK Bridge not available');
        const result = await vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' });
        return !!(result && result.result);
    },

    /* Межстраничная реклама */
    async showInterstitialAd() {
        if (!this.available) return false;
        try {
            const result = await vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' });
            return !!(result && result.result);
        } catch(e) {
            return false;
        }
    },

    /* Подписка на события VK Bridge */
    subscribe(callback) {
        if (!this.available) return;
        try { vkBridge.subscribe(callback); } catch(e) {}
    },

    /* Пригласить друзей */
    async inviteFriends() {
        if (!this.available) return;
        try { await vkBridge.send('VKWebAppShowInviteBox'); } catch(e) {}
    },

    /* Пост на стену */
    async postToWall(message) {
        if (!this.available) return;
        try {
            await vkBridge.send('VKWebAppShowWallPostBox', { message: message });
        } catch(e) {}
    },

    /* Разрешение на уведомления */
    async allowNotifications() {
        if (!this.available) return;
        try { await vkBridge.send('VKWebAppAllowNotifications'); } catch(e) {}
    }
};

async function loadProgressEverywhere() {
    let data = null;
    // 1. Пытаемся из VK Storage
    const cloud = await VK.storageGet('td_progress');
    if (cloud) {
        try { data = JSON.parse(cloud); } catch(e) {}
    }
    // 2. Фолбэк на localStorage
    if (!data) data = SafeStorage.getJSON('td_progress', null);
    return data;
}

    { id:31, name:'Космическая станция',nameEn:'Space Station',     waves:12, startGold:110, lives:9,  enemyHpMul:17.0, enemySpeedMul:1.60, difficulty:'dl_nightmare',monsters:['ghost','elite','hexTank'],         hue:230, size:16 },
    { id:32, name:'Метро',              nameEn:'Subway',            waves:12, startGold:105, lives:9,  enemyHpMul:18.0, enemySpeedMul:1.62, difficulty:'dl_nightmare',monsters:['worm','brute','hexTank'],          hue:80,  size:16 },
    { id:33, name:'Глубины океана',     nameEn:'Ocean Depths',      waves:13, startGold:100, lives:8,  enemyHpMul:19.0, enemySpeedMul:1.64, difficulty:'dl_nightmare',monsters:['ghost','elite','hexTank'],         hue:200, size:16 },
    { id:34, name:'Ядро планеты',       nameEn:'Planet Core',       waves:13, startGold:95,  lives:8,  enemyHpMul:20.0, enemySpeedMul:1.66, difficulty:'dl_nightmare',monsters:['brute','elite','hexTank','ghost'], hue:30,  size:17 },
    { id:35, name:'Император роя',      nameEn:'Swarm Emperor',     waves:4,  startGold:600, lives:10, enemyHpMul:24.0, enemySpeedMul:1.10, difficulty:'dl_boss',   monsters:['elite','hexTank','ghost'],           hue:0,   size:22, isBoss:true }
];

/* =========================================================
   4. ИГРА
   ========================================================= */
const Game = {
    canvas:null, ctx:null,
    state:'idle',
    gold:200, lives:20, wave:0, maxWaves:5, score:0,
    selectedTower:'gun',
    currentMission:null,
    currentDifficulty:'easy',
    towers:[], enemies:[], bullets:[], beams:[], particles:[],
    speedMul: 1, time: 0,
    mouseX: 0, mouseY: 0,
    mouseInside: false, previewVisible: false,
    path: PATHS[0].map(p => ({...p})),
    lastTime:0, spawnTimer:0, spawnInterval:1.8,
    enemiesToSpawn:0, enemiesSpawned:0,
    enemiesLeaked:0, enemiesTotalSpawned:0,
    waveActive:false, awaitingStart:true,
    waveLeader:'drone', waveSecondary:'drone',
    bossPendingForWave:false,
    selectedFieldTower: null,
    isTouch: IS_TOUCH,
    unlockedAbilities: [], abilityCooldowns: {}, aimMode: null, abilityEffects: [],
    bonusDamage:1, bonusRate:1, bonusRange:1,
    bonusGunDmg:1, bonusCannonDmg:1, bonusLaserDmg:1,
    bonusCostMul:1, bonusEnemySlow:1, bonusKillGold:1,
    ui:{ goldEl:null, livesEl:null, waveEl:null, scoreEl:null },
    lastUIState:{ gold:-1, lives:-1, wave:-1, score:-1 },

    init(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        canvas.width = LOGICAL_W; canvas.height = LOGICAL_H;
        this.refreshUI();
        this.canvas.addEventListener('click', (e) => this.handleClick(e));
        this.canvas.addEventListener('contextmenu', (e) => { if (this.aimMode) { e.preventDefault(); this.cancelAim(); } });
        this.canvas.addEventListener('mousemove', (e) => { this.mouseInside = true; this.updateMousePos(e); });
        this.canvas.addEventListener('mouseenter', () => { this.mouseInside = true; });
        this.canvas.addEventListener('mouseleave', () => { this.mouseInside = false; });
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const tt = e.touches[0];
            this.mouseInside = true;
            this.updateMousePos({ clientX:tt.clientX, clientY:tt.clientY });
            this.handleClick({ clientX:tt.clientX, clientY:tt.clientY });
        }, { passive:false });
        this.canvas.addEventListener('touchmove', (e) => {
            const tt = e.touches[0];
            this.mouseInside = true;
            this.updateMousePos({ clientX:tt.clientX, clientY:tt.clientY });
        }, { passive:true });

        const panel = document.getElementById('tower-target-panel');
        if (panel) {
            panel.addEventListener('click', (e) => {
                e.stopPropagation();
                const closeBtn = e.target.closest('[data-ttp-close]');
                if (closeBtn) { this.deselectFieldTower(); return; }
                const btn = e.target.closest('.ttp-btn[data-mode]');
                if (btn && this.selectedFieldTower) {
                    this.selectedFieldTower.targetMode = btn.dataset.mode;
                    this.showTowerPanel(this.selectedFieldTower);
                }
            });
        }
        const resumeBtn = document.getElementById('btn-resume');
        if (resumeBtn) resumeBtn.addEventListener('click', () => this.togglePause());
        const quitPauseBtn = document.getElementById('btn-quit-pause');
        if (quitPauseBtn) quitPauseBtn.addEventListener('click', () => this.quit());
        const cancelAimBtn = document.getElementById('btn-cancel-aim');
        if (cancelAimBtn) cancelAimBtn.addEventListener('click', (e) => { e.stopPropagation(); this.cancelAim(); });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Esc') {
                if (this.aimMode) { e.preventDefault(); this.cancelAim(); return; }
                if (this.state === 'running' || this.state === 'paused') { e.preventDefault(); this.togglePause(); }
            }
        });
        const abBar = document.getElementById('ability-bar');
        if (abBar) abBar.addEventListener('click', (e) => {
            e.stopPropagation();
            const btn = e.target.closest('.ability-btn');
            if (btn && btn.dataset.abilId) this.handleAbilityClick(btn.dataset.abilId);
        });
        this.lastTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
    },

    updateMousePos(e) {
        const rect = this.canvas.getBoundingClientRect();
        this.mouseX = (e.clientX - rect.left) / rect.width  * LOGICAL_W;
        this.mouseY = (e.clientY - rect.top)  / rect.height * LOGICAL_H;
    },
    refreshUI() {
        this.ui.goldEl  = document.getElementById('stat-gold');
        this.ui.livesEl = document.getElementById('stat-lives');
        this.ui.waveEl  = document.getElementById('stat-wave');
        this.ui.scoreEl = document.getElementById('stat-score');
        this.lastUIState = { gold:-1, lives:-1, wave:-1, score:-1 };
        this.updateUI();
    },
    togglePause() {
        if (this.state === 'running') {
            this.state = 'paused';
            this.showPauseOverlay(true);
        } else if (this.state === 'paused') {
            this.state = 'running';
            this.lastTime = performance.now();
            this.showPauseOverlay(false);
        }
    },
    showPauseOverlay(show) {
        const el = document.getElementById('pause-overlay');
        if (!el) return;
        el.classList.toggle('active', show);
        if (show) {
            const wEl = document.getElementById('pause-wave');
            const mEl = document.getElementById('pause-maxwave');
            if (wEl) wEl.textContent = this.wave;
            if (mEl) mEl.textContent = this.maxWaves;
        }
    },
    getEffectiveTower(typeKey) {
        const type = TOWER_TYPES[typeKey];
        if (!type) return null;
        let typeDmgMul = 1;
        if (typeKey === 'gun')    typeDmgMul = this.bonusGunDmg || 1;
        if (typeKey === 'cannon') typeDmgMul = this.bonusCannonDmg || 1;
        if (typeKey === 'laser')  typeDmgMul = this.bonusLaserDmg || 1;
        return {
            ...type,
            cost: Math.round(type.cost * (this.bonusCostMul || 1)),
            damage: type.damage * (this.bonusDamage || 1) * typeDmgMul,
            range: type.range * (this.bonusRange || 1),
            fireRate: type.fireRate / (this.bonusRate || 1)
        };
    },
    buildTowerSelector() {
        const sel = document.getElementById('tower-selector');
        if (!sel) return;
        sel.innerHTML = '';
        const unlocked = (window.Main && Main.progress && Main.progress.unlockedTowers) || ['gun','cannon','laser'];
        const order = ['gun','cannon','laser','freeze','rocket','lightning','flame','tesla'];
        const sorted = order.filter(k => unlocked.includes(k));
        sorted.forEach(key => {
            const tt = TOWER_TYPES[key];
            if (!tt) return;
            const eff = this.getEffectiveTower(key);
            const opt = document.createElement('div');
            opt.className = 'tower-option' + (key === this.selectedTower ? ' selected' : '');
            opt.dataset.tower = key;
            opt.innerHTML = `<span>${tt.icon || '🔫'}</span><div class="cost">${eff.cost}</div>`;
            opt.addEventListener('click', () => {
                sel.querySelectorAll('.tower-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                this.selectedTower = key;
                this.cancelAim();
                if (this.state === 'running') this.previewVisible = true;
                this.deselectFieldTower();
            });
            sel.appendChild(opt);
        });
        if (!sorted.includes(this.selectedTower)) {
            this.selectedTower = 'gun';
            const first = sel.querySelector('.tower-option[data-tower="gun"]');
            if (first) first.classList.add('selected');
        }
    },
    buildAbilityBar() {
        const bar = document.getElementById('ability-bar');
        if (!bar) return;
        bar.innerHTML = '';
        this.unlockedAbilities.forEach(abId => {
            const ab = ABILITIES.find(x => x.id === abId);
            if (!ab) return;
            const btn = document.createElement('div');
            btn.className = 'ability-btn';
            btn.dataset.abilId = ab.id;
            btn.innerHTML = `<span>${ab.icon}</span><div class="ab-label">${L(ab, 'name')}</div><div class="cd-overlay" data-cd></div>`;
            bar.appendChild(btn);
        });
        bar.classList.toggle('active', this.unlockedAbilities.length > 0);
        this.updateAbilityButtons();
    },
    updateAbilityButtons() {
        const bar = document.getElementById('ability-bar');
        if (!bar) return;
        bar.querySelectorAll('.ability-btn').forEach(btn => {
            const id = btn.dataset.abilId;
            const ab = ABILITIES.find(x => x.id === id);
            if (!ab) return;
            const cd = this.abilityCooldowns[id] || 0;
            const ready = cd <= 0;
            const overlay = btn.querySelector('[data-cd]');
            btn.classList.toggle('on-cooldown', !ready);
            btn.classList.toggle('active', this.aimMode === id);
            if (overlay) {
                if (ready) { overlay.style.height = '0%'; overlay.textContent = ''; }
                else { overlay.style.height = (cd / ab.cooldown * 100) + '%'; overlay.textContent = Math.ceil(cd); }
            }
        });
    },
    updateCancelAimButton() {
        const btn = document.getElementById('btn-cancel-aim');
        if (btn) btn.classList.toggle('active', !!this.aimMode);
    },
    handleAbilityClick(id) {
        if (this.state !== 'running') return;
        const ab = ABILITIES.find(x => x.id === id);
        if (!ab) return;
        if ((this.abilityCooldowns[id] || 0) > 0) return;
        if (this.aimMode === id) { this.cancelAim(); return; }
        if (ab.type === 'instant') this.activateAbility(id, null, null);
        else {
            this.aimMode = id;
            this.deselectFieldTower();
            this.previewVisible = false;
            this.updateAbilityButtons();
            this.updateCancelAimButton();
        }
    },
    cancelAim() { this.aimMode = null; this.updateAbilityButtons(); this.updateCancelAimButton(); },
    activateAbility(id, x, y) {
        const ab = ABILITIES.find(x => x.id === id);
        if (!ab) return;
        this.abilityCooldowns[id] = ab.cooldown;
        this.aimMode = null;
        switch (id) {
            case 'bomb':        this.doBomb(x, y, ab); break;
            case 'multibomb':   this.doMultiBomb(x, y, ab); break;
            case 'plane':       this.doPlane(x, y, ab); break;
            case 'fireWave':    this.doFireWave(ab); break;
            case 'freezeWave':  this.doFreezeWave(ab); break;
            case 'superCannon': this.doSuperCannon(x, y, ab); break;
        }
        this.updateAbilityButtons();
        this.updateCancelAimButton();
    },
    applyAoEDamage(x, y, radius, damage) {
        const toKill = [];
        for (const e of this.enemies) { if (Math.hypot(e.x - x, e.y - y) <= radius) { e.hp -= damage; if (e.hp <= 0) toKill.push(e); } }
        for (const e of toKill) this.killEnemy(e);
    },
    doBomb(x, y, ab) {
        this.applyAoEDamage(x, y, ab.radius, ab.damage);
        this.spawnParticles(x, y, '#ffaa00', 30); this.spawnParticles(x, y, '#ff4400', 20); this.spawnParticles(x, y, '#ffffff', 10);
        this.abilityEffects.push({ type:'blast', x, y, radius:ab.radius, life:0.5, maxLife:0.5, color:'#ff8800' });
    },
    doMultiBomb(x, y, ab) {
        for (let i = 0; i < (ab.count || 5); i++) {
            const a = Math.random() * Math.PI * 2, r = Math.random() * ab.radius * 0.8;
            const bx = x + Math.cos(a) * r, by = y + Math.sin(a) * r;
            this.applyAoEDamage(bx, by, 50, ab.damage);
            this.spawnParticles(bx, by, '#ffaa00', 12);
            this.abilityEffects.push({ type:'blast', x:bx, y:by, radius:50, life:0.4, maxLife:0.4, color:'#ffaa00' });
        }
    },
    doPlane(x, y, ab) {
        this.abilityEffects.push({ type:'plane', x:-80, y:y-60, targetX:LOGICAL_W+80, targetY:y-60, speed:700, dropX:x, dropY:y, radius:ab.radius, damage:ab.damage, dropped:false });
    },
    doFireWave(ab) { this.abilityEffects.push({ type:'wave', waveType:'fire', x:-50, speed:900, damage:ab.damage, hitIds:new Set(), color:'#ff4400', accent:'#ffcc44' }); },
    doFreezeWave(ab) { this.abilityEffects.push({ type:'wave', waveType:'freeze', x:-50, speed:900, freezeDuration:ab.freezeDuration, hitIds:new Set(), color:'#44ddff', accent:'#ffffff' }); },
    doSuperCannon(x, y, ab) {
        this.applyAoEDamage(x, y, ab.radius, ab.damage);
        this.spawnParticles(x, y, '#ffffff', 40); this.spawnParticles(x, y, '#ffee44', 25); this.spawnParticles(x, y, '#ff4400', 20);
        this.abilityEffects.push({ type:'superBeam', x1:0, y1:y, x2:x, y2:y, life:0.6, maxLife:0.6, color:'#ffee44' });
        this.abilityEffects.push({ type:'blast', x, y, radius:ab.radius*2, life:0.7, maxLife:0.7, color:'#ffffff' });
    },
    updateAbilityEffects(dt) {
        for (let i = this.abilityEffects.length - 1; i >= 0; i--) {
            const ef = this.abilityEffects[i];
            if (ef.type === 'blast' || ef.type === 'superBeam') { ef.life -= dt; if (ef.life <= 0) this.abilityEffects.splice(i, 1); }
            else if (ef.type === 'wave') {
                ef.x += ef.speed * dt;
                for (const e of this.enemies) {
                    if (!ef.hitIds.has(e) && e.x <= ef.x) {
                        ef.hitIds.add(e);
                        if (ef.waveType === 'fire') { e.hp -= ef.damage; this.spawnParticles(e.x, e.y, '#ff8800', 8); if (e.hp <= 0) this.killEnemy(e); }
                        else if (ef.waveType === 'freeze') { e.slowUntil = this.time + ef.freezeDuration; e.slowFactor = 0.02; this.spawnParticles(e.x, e.y, '#aaf0ff', 6); }
                    }
                }
                if (ef.x > LOGICAL_W + 80) this.abilityEffects.splice(i, 1);
            } else if (ef.type === 'plane') {
                ef.x += ef.speed * dt;
                if (!ef.dropped && ef.x >= ef.dropX) {
                    ef.dropped = true;
                    this.applyAoEDamage(ef.dropX, ef.dropY, ef.radius, ef.damage);
                    this.spawnParticles(ef.dropX, ef.dropY, '#ff8800', 25); this.spawnParticles(ef.dropX, ef.dropY, '#ffee44', 15);
                    this.abilityEffects.push({ type:'blast', x:ef.dropX, y:ef.dropY, radius:ef.radius, life:0.5, maxLife:0.5, color:'#ffaa00' });
                }
                if (ef.x > LOGICAL_W + 100) this.abilityEffects.splice(i, 1);
            }
        }
    },
    showTowerPanel(tower) {
        const panel = document.getElementById('tower-target-panel');
        if (!panel) return;
        panel.classList.add('active');
        const titleEl = panel.querySelector('.ttp-title');
        if (titleEl) titleEl.textContent = '🎯 ' + (L(tower, 'name') || t('ttp_title').replace('🎯 ',''));
        const mode = tower.targetMode || 'nearest';
        panel.querySelectorAll('.ttp-btn[data-mode]').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    },
    hideTowerPanel() { const panel = document.getElementById('tower-target-panel'); if (panel) panel.classList.remove('active'); },
    deselectFieldTower() { this.selectedFieldTower = null; this.hideTowerPanel(); },
    findTarget(tt) {
        const mode = tt.targetMode || 'nearest';
        let best = null, bestScore = -Infinity;
        for (const e of this.enemies) {
            const d = Math.hypot(e.x - tt.x, e.y - tt.y);
            if (d > tt.range) continue;
            let score;
            switch (mode) { case 'farthest': score = d; break; case 'strongest': score = e.hp; break; case 'weakest': score = -e.hp; break; default: score = -d; }
            if (score > bestScore) { best = e; bestScore = score; }
        }
        return best;
    },

    startMission(missionId, difficulty) {
        const m = MISSIONS.find(x => x.id === missionId);
        if (!m) return;
        const diff = DIFFICULTY_MODS[difficulty] || DIFFICULTY_MODS.easy;
        const up = (window.Main && Main.progress && Main.progress.upgrades) || {};
        this.bonusDamage    = 1 + 0.05 * (up.damage || 0);
        this.bonusRate      = 1 + 0.05 * (up.fireRate || 0);
        this.bonusRange     = 1 + 0.05 * (up.range || 0);
        this.bonusGunDmg    = 1 + 0.10 * (up.gunDmg || 0);
        this.bonusCannonDmg = 1 + 0.10 * (up.cannonDmg || 0);
        this.bonusLaserDmg  = 1 + 0.10 * (up.laserDmg || 0);
        this.bonusCostMul   = Math.max(0.5, 1 - 0.03 * (up.cost || 0));
        this.bonusEnemySlow = Math.max(0.7, 1 - 0.03 * (up.slow || 0));
        this.bonusKillGold  = 1 + 0.05 * (up.killGold || 0);

        const srcPath = PATHS[missionId - 1] || PATHS[0];
        this.path = srcPath.map(p => ({...p}));
        this.currentMission = { ...m, enemyHpMul: m.enemyHpMul * diff.hpMul, enemySpeedMul: m.enemySpeedMul * diff.speedMul };
        this.currentDifficulty = diff.key;

        this.unlockedAbilities = ((window.Main && Main.progress && Main.progress.unlockedAbilities) || []).slice();
        this.abilityCooldowns = {};
        for (const abId of this.unlockedAbilities) this.abilityCooldowns[abId] = 0;
        this.aimMode = null; this.abilityEffects = [];
        this.buildAbilityBar();
        this.updateCancelAimButton();

        this.state = 'running';
        this.gold = Math.max(50, m.startGold + diff.goldAdd) + 25 * (up.gold || 0) + STARTING_GOLD_BONUS + (diff.key === 'hard' ? HARD_DIFFICULTY_GOLD_BONUS : 0);
        this.lives = Math.max(3, m.lives + diff.livesAdd) + 1 * (up.lives || 0) + 2 * (up.shield || 0);
        this.wave = 0; this.maxWaves = m.waves + diff.waveAdd; this.score = 0;
        this.towers = []; this.enemies = []; this.bullets = []; this.beams = []; this.particles = [];
        this.waveActive = false; this.awaitingStart = true; this.spawnTimer = 0; this.time = 0;
        this.enemiesLeaked = 0; this.enemiesTotalSpawned = 0; this.bossPendingForWave = false;
        this.selectedFieldTower = null; this.hideTowerPanel(); this.showPauseOverlay(false);
        this.lastUIState = { gold:-1, lives:-1, wave:-1, score:-1 };
        this.previewVisible = false; this.speedMul = 1;
        this.updateSpeedButton(); this.updateStartButton(); this.updateUI(); this.buildTowerSelector(); this.showBattleUI(true);
    },
    startWave() {
        if (this.state !== 'running') return;
        if (!this.awaitingStart) return;
        this.awaitingStart = false;
        this.nextWave();
        this.updateStartButton();
    },
    updateStartButton() {
        const btn = document.getElementById('btn-start');
        if (!btn) return;
        const ready = this.awaitingStart && this.state === 'running';
        btn.classList.toggle('ready', ready);
        btn.disabled = !ready;
        if (this.wave >= this.maxWaves && !this.awaitingStart) btn.textContent = t('btn_finish');
        else if (ready) btn.textContent = this.wave === 0 ? t('btn_start') : t('btn_wave', this.wave + 1);
        else btn.textContent = t('btn_wave_n', this.wave);
    },
    updateSpeedButton() { const btn = document.getElementById('btn-speed'); if (btn) { btn.textContent = t('btn_speed', this.speedMul); btn.classList.toggle('active', this.speedMul > 1); } },
    toggleSpeed() { this.speedMul = this.speedMul === 1 ? 2 : (this.speedMul === 2 ? 3 : 1); this.updateSpeedButton(); },
    quit() {
        this.state = 'idle'; this.awaitingStart = false;
        this.deselectFieldTower(); this.cancelAim();
        this.showPauseOverlay(false); this.showBattleUI(false);
        this.speedMul = 1; this.previewVisible = false;
        this.updateSpeedButton();
        if (window.Main) { Main.updateBestScore(); Main.updateProgressInfo(); Main.updateResourcesInfo(); Main.showScreen('menu'); }
    },
    nextWave() {
        if (this.wave >= this.maxWaves) { this.endGame(true); return; }
        this.wave++;
        this.enemiesSpawned = 0; this.spawnTimer = 0;
        this.spawnInterval = Math.max(0.7, 1.8 - this.wave * 0.15);
        if (this.currentMission.isBoss) { this.enemiesToSpawn = 5 + this.wave * 2; this.bossPendingForWave = true; this.spawnInterval = Math.max(0.9, 1.6 - this.wave * 0.1); }
        else { this.enemiesToSpawn = Math.round((5 + this.wave * 3) * 1.2); this.bossPendingForWave = false; }
        this.waveActive = true;
        const pool = this.currentMission.monsters || ['drone'];
        this.waveLeader = pool[(this.wave - 1) % pool.length];
        const others = pool.filter(x => x !== this.waveLeader);
        this.waveSecondary = others.length > 0 ? others[Math.floor(Math.random() * others.length)] : this.waveLeader;
        this.updateUI(); this.updateStartButton();
    },
    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
        this.lastTime = timestamp; this.time += dt;
        if (this.state === 'running') {
            for (let i = 0; i < this.speedMul; i++) { try { this.update(dt); } catch (err) { console.error('[update]', err); } }
        }
        try { this.render(); } catch (err) { console.error('[render]', err); }
        requestAnimationFrame((t) => this.loop(t));
    },
    update(dt) {
        for (const id in this.abilityCooldowns) if (this.abilityCooldowns[id] > 0) this.abilityCooldowns[id] = Math.max(0, this.abilityCooldowns[id] - dt);
        this.updateAbilityButtons();
        this.updateAbilityEffects(dt);
        if (this.waveActive && this.enemiesSpawned < this.enemiesToSpawn) {
            this.spawnTimer -= dt;
            if (this.spawnTimer <= 0) { this.spawnEnemy(); this.spawnTimer = this.spawnInterval; this.enemiesSpawned++; }

        ctx.globalAlpha = 0.7;
        switch (this.selectedTower) {
            case 'gun': this.drawGunTower(ctx, ghost, 1); break;
            case 'cannon': this.drawCannonTower(ctx, ghost, 1); break;
            case 'laser': this.drawLaserTower(ctx, ghost, 1); break;
            case 'freeze': this.drawFreezeTower(ctx, ghost, 1); break;
            case 'rocket': this.drawRocketTower(ctx, ghost, 1); break;
            case 'lightning': this.drawLightningTower(ctx, ghost, 1); break;
            case 'flame': this.drawFlameTower(ctx, ghost, 1); break;
            case 'tesla': this.drawTeslaTower(ctx, ghost, 1); break;
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = valid ? 'rgba(180,255,220,0.95)' : 'rgba(255,180,180,0.95)';
        ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(L(type, 'name'), x, y - 30); ctx.textAlign = 'start';
    },
    updateUI() {
        const s = this.lastUIState, g = Math.floor(this.gold);
        if (this.ui.goldEl && s.gold !== g) { s.gold = g; this.ui.goldEl.textContent = g; }
        if (this.ui.livesEl && s.lives !== this.lives) { s.lives = this.lives; this.ui.livesEl.textContent = this.lives; }
        if (this.ui.waveEl && s.wave !== this.wave) { s.wave = this.wave; this.ui.waveEl.textContent = this.wave + ' / ' + this.maxWaves; }
        if (this.ui.scoreEl && s.score !== this.score) { s.score = this.score; this.ui.scoreEl.textContent = this.score; }
    },
    showBattleUI(show) {
        const el = document.getElementById('battle-ui');
        if (el) el.classList.toggle('active', show);
        const abBar = document.getElementById('ability-bar');
        if (abBar) abBar.classList.toggle('active', show && this.unlockedAbilities.length > 0);
    },
    computeStars(win) {
        if (!win) return 0;
        if (this.enemiesTotalSpawned === 0) return 3;
        if (this.enemiesLeaked === 0) return 3;
        const ratio = this.enemiesLeaked / this.enemiesTotalSpawned;
        if (ratio >= 0.8) return 1;
        return 2;
    },
    endGame(win) {
        this.state = 'gameover'; this.awaitingStart = false;
        this.deselectFieldTower(); this.cancelAim();
        this.showPauseOverlay(false); this.showBattleUI(false);
        this.speedMul = 1; this.previewVisible = false;
        this.updateSpeedButton(); this.updateStartButton();
        const best = parseInt(SafeStorage.get('td_best', '0'), 10) || 0;
        if (this.score > best) SafeStorage.set('td_best', this.score);
        const stars = this.computeStars(win);
        let missionReward = 0;
        if (win && this.currentMission && window.Main) {
            const diff = DIFFICULTY_MODS[this.currentDifficulty] || DIFFICULTY_MODS.easy;
            const baseReward = Math.floor(this.gold + this.score / 5);
            const reward = Math.floor(baseReward * diff.rewardMul);
            const earned = Main.saveMissionReward(this.currentMission.id, this.currentDifficulty, reward);
            Main.saveStars(this.currentMission.id, this.currentDifficulty, stars);
            Main.unlockNextMission(this.currentMission.id);
            missionReward = earned;
        }
        if (window.Main) Main.showResult(win, this.score, this.wave, this.currentMission, missionReward, stars, this.currentDifficulty);
        // Межстраничная реклама при поражении
        if (!win) { VK.showInterstitialAd(); }
    }
};

/* =========================================================
   5. МЕНЮ
   ========================================================= */
const Main = {
    screens:{},
    progress:{ unlocked:1, completed:[], rewards:{}, resources:0, upgrades:{}, stars:{}, unlockedTowers:['gun','cannon','laser'], unlockedAbilities:[] },
    shopTab: 'general',

    async init() {
        // 1. Парсим параметры запуска VK
        VK.parseLaunchParams();

        // 2. Инициализируем VK Bridge
        await VK.init();

        // 3. Получаем информацию о пользователе (опционально)
        await VK.getUserInfo();

        // 4. Определяем язык
        try {
            let detectedLang = 'ru';
            const vkLang = VK.getLanguage();
            if (vkLang) {
                detectedLang = vkLang;
            } else {
                const navLang = (navigator.language || navigator.userLanguage || 'ru').slice(0, 2).toLowerCase();
                detectedLang = I18N[navLang] ? navLang : 'ru';
            }
            currentLang = detectedLang;
        } catch (e) { currentLang = 'ru'; }

        // 5. Загружаем прогресс (VK Storage + fallback на localStorage)
        try { this.loadProgress(); } catch(e) {}
        try {
            const cloudData = await loadProgressEverywhere();
            if (cloudData) {
                this.progress = cloudData;
                if (!this.progress.rewards) this.progress.rewards = {};
                if (!this.progress.upgrades) this.progress.upgrades = {};
                if (!this.progress.stars) this.progress.stars = {};
                if (!Array.isArray(this.progress.unlockedTowers)) this.progress.unlockedTowers = ['gun','cannon','laser'];
                if (!Array.isArray(this.progress.unlockedAbilities)) this.progress.unlockedAbilities = [];
                if (typeof this.progress.resources !== 'number') this.progress.resources = 0;
            }
        } catch(e) {}

        try { this.buildScreens(); } catch (e) { console.error('[Main] buildScreens:', e); }
        try { Game.init(document.getElementById('gameCanvas')); } catch (e) { console.error('[Main] Game.init:', e); }
        try { this.showScreen('menu'); } catch (e) {}

        // 6. Подписка на события VK Bridge
        VK.subscribe((e) => {
            const type = e.detail.type;
            if (type === 'VKWebAppViewHide' || type === 'VKWebAppViewRestore') {
                // Обрабатываем скрытие/показ окна
                if (type === 'VKWebAppViewHide' && Game.state === 'running') {
                    Game.togglePause();
                }
            }
        });

        // 7. Дополнительно на сворачивание браузера
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && Game.state === 'running') Game.togglePause();
        });
    },

    loadProgress() {
        const p = SafeStorage.getJSON('td_progress', null);
        if (p && typeof p.unlocked === 'number' && Array.isArray(p.completed)) {
            this.progress = p;
            if (!this.progress.rewards) this.progress.rewards = {};
            if (!this.progress.upgrades) this.progress.upgrades = {};
            if (!this.progress.stars) this.progress.stars = {};
            if (!Array.isArray(this.progress.unlockedTowers)) this.progress.unlockedTowers = ['gun','cannon','laser'];
            else for (const k of ['gun','cannon','laser']) if (!this.progress.unlockedTowers.includes(k)) this.progress.unlockedTowers.push(k);
            if (!Array.isArray(this.progress.unlockedAbilities)) this.progress.unlockedAbilities = [];
            if (typeof this.progress.resources !== 'number') this.progress.resources = 0;
        }
    },
    saveProgress() {
        // 1. Локально
        SafeStorage.setJSON('td_progress', this.progress);
        // 2. В облако VK (async, не блокирует)
        VK.storageSet('td_progress', JSON.stringify(this.progress)).catch(()=>{});
    },
    getResources() { return Math.max(0, Math.floor(this.progress.resources || 0)); },
    saveMissionReward(missionId, difficulty, reward) {
        if (!this.progress.rewards) this.progress.rewards = {};
        const key = `${missionId}_${difficulty}`;
        const prev = this.progress.rewards[key] || 0;
        if (reward > prev) {
            const diff = reward - prev;
            this.progress.rewards[key] = reward;
            this.progress.resources = (this.progress.resources || 0) + diff;
            this.saveProgress();
            return diff;
        }
        return 0;
    },
    saveStars(missionId, difficulty, stars) {
        if (!this.progress.stars) this.progress.stars = {};
        if (!this.progress.stars[missionId]) this.progress.stars[missionId] = {};
        const prev = this.progress.stars[missionId][difficulty] || 0;
        if (stars > prev) { this.progress.stars[missionId][difficulty] = stars; this.saveProgress(); }
    },
    getStars(missionId, difficulty) {
        if (!this.progress.stars || !this.progress.stars[missionId]) return 0;
        return this.progress.stars[missionId][difficulty] || 0;
    },
    getMissionTotalStars(missionId) {
        let sum = 0; for (const d of DIFFICULTY_ORDER) sum += this.getStars(missionId, d); return sum;
    },
    getTotalStars() { let sum = 0; for (const m of MISSIONS) sum += this.getMissionTotalStars(m.id); return sum; },
    getMaxTotalStars() { return MISSIONS.length * DIFFICULTY_ORDER.length * 3; },
    isDifficultyUnlocked(missionId, difficulty) {
        if (difficulty === 'easy') return true;
        if (difficulty === 'medium') return this.getStars(missionId, 'easy') >= 1;
        if (difficulty === 'hard') return this.getStars(missionId, 'medium') >= 1;
        return false;
    },
    isMissionUnlocked(id) {
        if (id === 1) return true;
        const m = MISSIONS.find(x => x.id === id);
        if (!m) return false;
        if (m.isBoss) { for (let i = 1; i < id; i++) if (this.getMissionTotalStars(i) < 9) return false; return true; }
        return this.getMissionTotalStars(id - 1) >= 1;
    },
    isMissionCompleted(id) { return this.getMissionTotalStars(id) > 0; },
    getBossRequirementProgress(id) {
        let done = 0, total = id - 1;
        for (let i = 1; i < id; i++) if (this.getMissionTotalStars(i) >= 9) done++;
        return { done, total };
    },
    getUpgradeLevel(id) { return (this.progress.upgrades && this.progress.upgrades[id]) || 0; },
    getUpgradeCost(item) {
        const lvl = this.getUpgradeLevel(item.id);
        return Math.round(item.baseCost * Math.pow(item.costMul, lvl));
    },
    buyUpgrade(id) {
        const item = SHOP_ITEMS.find(x => x.id === id);
        if (!item) return false;
        const lvl = this.getUpgradeLevel(id);
        if (lvl >= item.maxLevel) return false;
        const cost = this.getUpgradeCost(item);
        if (this.getResources() < cost) return false;
        this.progress.resources -= cost;
        if (!this.progress.upgrades) this.progress.upgrades = {};
        this.progress.upgrades[id] = lvl + 1;
        if (item.type === 'unlock' && item.unlocksTower) {
            if (!Array.isArray(this.progress.unlockedTowers)) this.progress.unlockedTowers = ['gun','cannon','laser'];
            if (!this.progress.unlockedTowers.includes(item.unlocksTower)) this.progress.unlockedTowers.push(item.unlocksTower);
        }
        if (item.type === 'unlock' && item.unlocksAbility) {
            if (!Array.isArray(this.progress.unlockedAbilities)) this.progress.unlockedAbilities = [];
            if (!this.progress.unlockedAbilities.includes(item.unlocksAbility)) this.progress.unlockedAbilities.push(item.unlocksAbility);
        }
        this.saveProgress();
        return true;
    },
    updateResourcesInfo() { const el = document.getElementById('resources-info'); if (el) el.textContent = this.getResources(); },
    unlockNextMission(completedId) {
        if (!this.progress.completed.includes(completedId)) this.progress.completed.push(completedId);
        this.saveProgress();
    },
    syncShopTabs() {
        const shop = this.screens.shop;

    renderMissions() {
        const grid = document.getElementById('missions-grid');
        if (!grid) return;
        grid.innerHTML = '';
        MISSIONS.forEach(m => {
            const unlocked = this.isMissionUnlocked(m.id);
            const completed = this.isMissionCompleted(m.id);
            const totalStars = this.getMissionTotalStars(m.id);
            const maxStars = DIFFICULTY_ORDER.length * 3;
            let classes = 'mission-card';
            if (m.isBoss) classes += ' boss';
            if (!unlocked) classes += ' locked';
            if (completed) classes += ' completed';
            let infoText;
            if (m.isBoss) {
                if (unlocked) infoText = t('boss_available');
                else { const req = this.getBossRequirementProgress(m.id); infoText = t('boss_progress', req.done, req.total); }
            } else {
                infoText = `${t('waves_label')}: ${m.waves}<br>${t(m.difficulty)}`;
            }
            const card = document.createElement('div');
            card.className = classes;
            card.innerHTML = `
                <div class="mission-status"></div>
                <div class="mission-num">${m.id}</div>
                <div class="mission-name">${L(m, 'name')}</div>
                <div class="mission-info">${infoText}</div>
                <div class="mission-stars">⭐ ${totalStars}<span class="empty">/${maxStars}</span></div>
            `;
            if (unlocked) card.addEventListener('click', () => this.openDifficultySelection(m.id));
            grid.appendChild(card);
        });
    },

    openDifficultySelection(missionId) {
        const m = MISSIONS.find(x => x.id === missionId);
        if (!m) return;
        const titleEl = document.getElementById('difficulty-title');
        if (titleEl) titleEl.textContent = `${m.isBoss ? '💀 ' : ''}${t('difficulty_title')} ${m.id}: ${L(m, 'name')}`;
        this.renderDifficulties(missionId);
        this.showScreen('difficulty');
    },

    renderDifficulties(missionId) {
        const list = document.getElementById('difficulty-list');
        if (!list) return;
        list.innerHTML = '';
        DIFFICULTY_ORDER.forEach(diffKey => {
            const unlocked = this.isDifficultyUnlocked(missionId, diffKey);
            const stars = this.getStars(missionId, diffKey);
            let starStr = '';
            for (let i = 0; i < 3; i++) starStr += i < stars ? '<span class="filled">★</span>' : '<span class="empty">★</span>';
            const btn = document.createElement('button');
            btn.className = 'difficulty-btn ' + diffKey + (unlocked ? '' : ' locked');
            btn.type = 'button';
            btn.innerHTML = `
                <div class="diff-icon">${DIFFICULTY_ICONS[diffKey]}</div>
                <div class="diff-info">
                    <div class="diff-name">${t('diff_' + diffKey)}</div>
                    <div class="diff-desc">${t('diff_' + diffKey + '_desc')}</div>
                    ${!unlocked ? `<div class="diff-lock">${t('diff_locked')}</div>` : ''}
                </div>
                <div class="diff-stars">${starStr}</div>
            `;
            if (unlocked) btn.addEventListener('click', () => this.startMission(missionId, diffKey));
            list.appendChild(btn);
        });
    },

    startMission(missionId, difficulty) {
        if (!this.isMissionUnlocked(missionId)) return;
        if (!this.isDifficultyUnlocked(missionId, difficulty)) return;
        this.showScreen(null);
        requestAnimationFrame(() => Game.startMission(missionId, difficulty));
    },

    renderShop() {
        const grid = document.getElementById('shop-grid');
        if (!grid) return;
        const resources = this.getResources();
        const resEl = document.getElementById('shop-resources');
        if (resEl) resEl.textContent = resources;
        const items = SHOP_ITEMS.filter(it => it.cat === this.shopTab);
        grid.innerHTML = '';
        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'shop-empty';
            empty.textContent = t('shop_empty');
            grid.appendChild(empty);
            return;
        }
        items.forEach(item => {
            const lvl = this.getUpgradeLevel(item.id);
            const isMaxed = lvl >= item.maxLevel;
            const cost = this.getUpgradeCost(item);
            const canAfford = !isMaxed && resources >= cost;
            const isUnlock = item.type === 'unlock';
            let inner;
            if (isUnlock) {
                const owned = lvl >= 1;
                inner = `
                    <div class="shop-icon">${item.icon}</div>
                    <div class="shop-name">${L(item, 'name')}</div>
                    <div class="shop-desc">${L(item, 'desc')}</div>
                    ${owned ? `<div class="shop-maxed">${t('shop_unlocked')}</div>`
                            : `<div class="shop-cost ${canAfford ? '' : 'cant'}">💰 ${cost} <span class="label">${t('shop_resources_word')}</span></div>`}
                `;
            } else {
                let dots = '';
                for (let i = 0; i < item.maxLevel; i++) dots += i < lvl ? '●' : '<span class="empty">●</span>';
                inner = `
                    <div class="shop-icon">${item.icon}</div>
                    <div class="shop-name">${L(item, 'name')}</div>
                    <div class="shop-desc">${L(item, 'desc')}</div>
                    <div class="shop-level">${t('shop_level')}: ${lvl} / ${item.maxLevel} <span class="dots">${dots}</span></div>
                    ${isMaxed ? `<div class="shop-maxed">${t('shop_max')}</div>`
                             : `<div class="shop-cost ${canAfford ? '' : 'cant'}">💰 ${cost} <span class="label">${t('shop_resources_word')}</span></div>`}
                `;
            }
            const el = document.createElement('div');
            el.className = 'shop-item' + (isMaxed ? ' maxed' : '') + (!isMaxed && !canAfford ? ' cant-afford' : '');
            el.dataset.itemId = item.id;
            el.innerHTML = inner;
            grid.appendChild(el);
        });
    },

    handleAction(action) {
        switch (action) {
            case 'open-campaign': this.renderMissions(); this.showScreen('campaign'); break;
            case 'back-campaign': this.renderMissions(); this.showScreen('campaign'); break;
            case 'open-shop': this.showScreen('shop'); this.syncShopTabs(); this.renderShop(); break;
            case 'back-menu':
                Game.state = 'idle'; Game.awaitingStart = false;
                Game.deselectFieldTower(); Game.cancelAim();
                Game.showPauseOverlay(false); Game.showBattleUI(false);
                Game.speedMul = 1; Game.previewVisible = false;
                Game.updateSpeedButton();
                this.updateBestScore(); this.updateProgressInfo(); this.updateResourcesInfo();
                this.showScreen('menu');
                break;
            case 'next-mission': {
                const cur = Game.currentMission;
                const next = cur ? cur.id + 1 : 1;
                if (next <= MISSIONS.length) this.openDifficultySelection(next);
                else { this.renderMissions(); this.showScreen('campaign'); }
                break;
            }
            case 'reset-progress':
                if (confirm(t('confirm_reset'))) {
                    this.progress = { unlocked:1, completed:[], rewards:{}, resources:0, upgrades:{}, stars:{}, unlockedTowers:['gun','cannon','laser'], unlockedAbilities:[] };
                    this.saveProgress();
                    this.updateProgressInfo(); this.updateBestScore(); this.updateResourcesInfo();
                }
                break;
            case 'show-ads': this.showRewardedAd(); break;
        }
    },

    showScreen(name) {
        Object.values(this.screens).forEach(s => s.classList.add('hidden'));
        if (name && this.screens[name]) this.screens[name].classList.remove('hidden');
    },

    showResult(win, score, wave, mission, reward = 0, stars = 0, difficulty = 'easy') {
        const title = document.getElementById('result-title');
        title.textContent = win ? t('result_win') : t('result_lose');
        title.style.background = win ? 'linear-gradient(135deg,#00ffaa,#0088ff)' : 'linear-gradient(135deg,#ff4444,#aa0000)';
        title.style.webkitBackgroundClip = 'text';
        title.style.webkitTextFillColor = 'transparent';

        document.getElementById('result-score').textContent = score;
        document.getElementById('result-waves').textContent = wave;
        document.getElementById('result-mission').textContent = mission ? `${mission.id}. ${L(mission, 'name')}` : '—';

        const diffEl = document.getElementById('result-diff');
        diffEl.textContent = `${DIFFICULTY_ICONS[difficulty]} ${t('result_difficulty')}: ${t('diff_' + difficulty)}${mission && mission.isBoss ? t('result_boss_suffix') : ''}`;
        diffEl.classList.toggle('boss', !!(mission && mission.isBoss));

        const starsEl = document.getElementById('result-stars');
        if (starsEl) {
            let html = '';
            for (let i = 0; i < 3; i++) html += i < stars ? '<span class="filled">★</span>' : '<span class="empty">★</span>';
            starsEl.innerHTML = html;
        }

        const rewardEl = document.getElementById('result-reward');
        if (rewardEl) rewardEl.textContent = win ? reward : 0;

        const unlockEl = document.getElementById('result-unlock');
        unlockEl.textContent = '';
        unlockEl.style.color = '#00ffaa';
        if (win && mission && mission.id < MISSIONS.length) {
            const nextM = MISSIONS.find(x => x.id === mission.id + 1);
            if (nextM && this.isMissionUnlocked(nextM.id)) {
                unlockEl.textContent = t('result_unlock', nextM.id, L(nextM, 'name'));
            } else if (nextM && nextM.isBoss) {
                const req = this.getBossRequirementProgress(nextM.id);
                unlockEl.style.color = '#ff8888';
                unlockEl.textContent = t('result_boss_lock', nextM.id, req.done, req.total);
            }
        } else if (win && mission && mission.id === MISSIONS.length) {
            unlockEl.textContent = t('result_campaign_done');
        }

        const nextBtn = document.querySelector('[data-action="next-mission"]');
        if (nextBtn) nextBtn.style.display = (win && mission && mission.id < MISSIONS.length) ? 'block' : 'none';

        this.showScreen('result');
        this.updateResourcesInfo();
        this.updateProgressInfo();
    },

    addResources(amount) {
        this.progress.resources = (this.progress.resources || 0) + amount;
        this.saveProgress();
        this.updateResourcesInfo();
        const shopRes = document.getElementById('shop-resources');
        if (shopRes) shopRes.textContent = this.getResources();
        if (this.screens.shop && !this.screens.shop.classList.contains('hidden')) {
            this.renderShop();
        }
    },

    showToast(text) {
        const toast = document.createElement('div');
        toast.textContent = text;
        toast.style.cssText = `
            position:fixed; top:24px; left:50%; transform:translateX(-50%);
            padding:12px 24px; border-radius:12px;
            background:linear-gradient(135deg,#0a5a2a,#0f8a44);
            border:2px solid #00ffaa; color:#eafff2;
            font-family:inherit; font-size:1.1rem; font-weight:700;
            box-shadow:0 0 24px rgba(0,255,170,0.55);
            z-index:99999; pointer-events:none;
            transition:opacity 0.4s ease, transform 0.4s ease;
        `;
        document.body.appendChild(toast);
        requestAnimationFrame(() => {
            toast.style.transform = 'translateX(-50%) translateY(-8px)';
        });
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(-24px)';
            setTimeout(() => toast.remove(), 450);
        }, 1800);
    },

    async showRewardedAd() {
        if (!VK.available) {
            alert(t('alert_ads_only'));
            return;
        }
        try {
            const rewarded = await VK.showRewardedAd();
            if (rewarded) {
                this.addResources(AD_REWARD_RESOURCES);
                this.showToast('+' + AD_REWARD_RESOURCES + ' 💰');
            } else {
                // Пользователь закрыл рекламу досрочно — награду не даём
                console.log('[VK] Rewarded ad closed without reward');
            }
        } catch (e) {
            console.warn('[VK] Rewarded ad error:', e);
            alert(t('alert_ads_only'));
        }
    },

    updateBestScore() { const best = SafeStorage.get('td_best', '0') || '0'; const el = document.getElementById('best-score'); if (el) el.textContent = best; },
    updateProgressInfo() { const el = document.getElementById('progress-info'); if (el) el.textContent = `${this.getTotalStars()}/${this.getMaxTotalStars()}`; }
};

window.Main = Main;
window.Game = Game;
window.MISSIONS = MISSIONS;
window.t = t;
window.L = L;
window.VK = VK;
window.addEventListener('DOMContentLoaded', () => Main.init());
</script>
</body>
</html>
